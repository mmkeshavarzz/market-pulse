<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نبض بازار | داشبورد پاستلی ۲۰۲۶ 🍭</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* =========================================================
           تم ۲۰۲۶: پاستلی، شاد و بنتو گرید 🍱✨
           ========================================================= */
        :root {
            /* رنگ‌های پاستلی بهاری */
            --bg-color: #fdf2f8; /* صورتی خیلی روشن */
            --card-gold: #fef08a; /* زرد پاستلی نرم */
            --card-silver: #e2e8f0; /* آبی/طوسی ملایم */
            --card-dollar: #a7f3d0; /* سبز نعنایی پاستلی */
            
            --text-main: #334155;
            --text-muted: #64748b;
            
            /* سایه‌های نرم برای عمق دادن به بنتو */
            --bento-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --bento-radius: 35px;
        }

        body.dark-mode {
            --bg-color: #0f172a; 
            --card-gold: rgba(253, 224, 71, 0.15);
            --card-silver: rgba(148, 163, 184, 0.15);
            --card-dollar: rgba(52, 211, 153, 0.15);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --bento-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        @import url('https://v1.fontapi.ir/css/Vazir');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazir', sans-serif;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 237, 213, 0.4) 0%, transparent 50%),
                              radial-gradient(circle at 90% 80%, rgba(224, 231, 255, 0.4) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard-wrapper {
            width: 100%;
            max-width: 900px;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        /* =========================================================
           ساختار Bento Grid 🍱
           ========================================================= */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, auto);
            gap: 20px;
            grid-template-areas: 
                "gold gold silver"
                "dollar dollar dollar";
        }

        .bento-card {
            border-radius: var(--bento-radius);
            padding: 35px 25px;
            box-shadow: var(--bento-shadow);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
        }

        .bento-card:hover {
            transform: translateY(-5px);
        }

        /* اختصاص گرید اریا و رنگ به کارت‌ها */
        .card-gold { grid-area: gold; background-color: var(--card-gold); }
        .card-silver { grid-area: silver; background-color: var(--card-silver); }
        .card-dollar { grid-area: dollar; background-color: var(--card-dollar); }

        .price-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .price-value {
            font-size: 2.8rem;
            font-weight: 900;
            direction: ltr;
            letter-spacing: 1px;
            /* 🪄 جادوی کپی شدن با یک کلیک (Req #3) */
            user-select: all;
            -webkit-user-select: all;
            cursor: copy;
        }

        /* =========================================================
           دکمه‌ها و ابزارها
           ========================================================= */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 20px;
            color: var(--text-main);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        body.dark-mode .btn {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn:active { transform: scale(0.95); }
        .btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* ریسپانسیو اختصاصی برای موبایل */
        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: 1fr;
                grid-template-areas: 
                    "gold"
                    "silver"
                    "dollar";
            }
            .price-value { font-size: 2.2rem; }
            .header h1 { font-size: 2rem; }
        }

        .exporting .controls { display: none; }
    </style>
</head>
<body>

    <div class="dashboard-wrapper" id="capture-area">
        
        <div class="header">
            <h1>نبض بازار 💖</h1>
            <p id="last-update" style="color: var(--text-muted); font-size: 1rem; font-weight: 500;">در حال دریافت اطلاعات تقویم خورشیدی... ⏳</p>
        </div>

        <div class="bento-grid">
            <!-- کارت طلا -->
            <div class="bento-card card-gold">
                <div class="price-title">🌟 طلای ۱۸ عیار (میلی‌گرم)</div>
                <div class="price-value" id="gold-price" title="برای کپی کلیک کنید">---</div>
            </div>

            <!-- کارت نقره -->
            <div class="bento-card card-silver">
                <div class="price-title">🛸 نقره ۹۹۹</div>
                <div class="price-value" id="silver-price" title="برای کپی کلیک کنید">---</div>
            </div>

            <!-- کارت دلار -->
            <div class="bento-card card-dollar">
                <div class="price-title">💸 دلار آمریکا (ریال)</div>
                <div class="price-value" id="dollar-price" title="برای کپی کلیک کنید">---</div>
            </div>
        </div>

        <!-- ابزارها و دکمه‌ها -->
        <div class="controls">
            <button class="btn" onclick="toggleTheme()" title="تغییر تم">
                <svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18zm0-2a7 7 0 1 0 0-14 7 7 0 0 0 0 14zm0-2.5A4.5 4.5 0 1 1 12 7.5v9z"/></svg>
            </button>
            <button class="btn" onclick="exportToPNG()" title="خروجی عکس">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>
            <button class="btn" onclick="fetchData()" title="به‌روزرسانی">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const formatNumber = (num) => {
            if (!num) return "نامشخص";
            return new Intl.NumberFormat('fa-IR').format(num);
        };

        const updateUI = (data) => {
            document.getElementById('gold-price').innerText = formatNumber(data.gold_mg_rial);
            document.getElementById('silver-price').innerText = formatNumber(data.silver_mg_rial);
            document.getElementById('dollar-price').innerText = formatNumber(data.dollar_rial);
            
            if(data.updated_at) {
                const date = new Date(data.updated_at);
                // 🌞 تبدیل به تاریخ شمسی و ساعت تهران با کلاس جهانی!
                const options = { 
                    calendar: 'persian', 
                    timeZone: 'Asia/Tehran',
                    year: 'numeric', 
                    month: 'long', 
                    day: 'numeric', 
                    hour: '2-digit', 
                    minute: '2-digit' 
                };
                const persianDate = new Intl.DateTimeFormat('fa-IR', options).format(date);
                document.getElementById('last-update').innerText = "⏰ آخرین به‌روزرسانی: " + persianDate;
            }
        };

        const fetchData = async () => {
            try {
                const response = await fetch(`./data/prices.json?t=${new Date().getTime()}`);
                const data = await response.json();
                localStorage.setItem('market_pulse_data', JSON.stringify(data));
                updateUI(data);
            } catch (error) {
                console.error("خطا در دریافت اطلاعات", error);
                document.getElementById('last-update').innerText = "⚠️ خطا در دریافت اینترنت! نمایش دیتای آفلاین...";
                const cachedData = localStorage.getItem('market_pulse_data');
                if (cachedData) updateUI(JSON.parse(cachedData));
            }
        };

        const toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('market_pulse_theme', isDark ? 'dark' : 'light');
        };

        window.onload = () => {
            if (localStorage.getItem('market_pulse_theme') === 'dark') document.body.classList.add('dark-mode');
            const cachedData = localStorage.getItem('market_pulse_data');
            if (cachedData) updateUI(JSON.parse(cachedData));
            fetchData();
        };

        const exportToPNG = () => {
            const wrap = document.getElementById('capture-area');
            document.body.classList.add('exporting');
            html2canvas(wrap, {
                backgroundColor: document.body.classList.contains('dark-mode') ? '#0f172a' : '#fdf2f8',
                scale: 2 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Nabz_Bazaar_2026.png'; 
                link.href = canvas.toDataURL('image/png');
                link.click();
                document.body.classList.remove('exporting');
            });
        };
    </script>
</body>
</html>
