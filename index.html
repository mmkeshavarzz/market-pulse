<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نبض بازار | Market Pulse</title>
  <meta name="description" content="داشبورد لحظه‌ای نبض بازار - طلا، نقره و دلار" />
  <style>
    :root{
      --bg:#f6f8fb;
      --bg2:#eef3fa;
      --text:#1f2a37;
      --muted:#6b7280;
      --glass: rgba(255,255,255,.62);
      --stroke: rgba(255,255,255,.5);
      --shadow: 0 12px 30px rgba(17,24,39,.12);

      --c1:#9ac6ff;
      --c2:#8fe3c5;
      --c3:#ffd79a;
      --c4:#d9b3ff;

      --ok:#10b981;
      --warn:#f59e0b;
      --danger:#ef4444;
    }

    [data-theme="deep-dark"]{
      --bg:#081227;
      --bg2:#0b1a34;
      --text:#dbeafe;
      --muted:#93a3bf;
      --glass: rgba(13,24,46,.58);
      --stroke: rgba(88,131,189,.22);
      --shadow: 0 16px 34px rgba(0,0,0,.42);

      --c1:#2e5cff;
      --c2:#00b894;
      --c3:#f7b731;
      --c4:#7f5af0;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 95% -10%, rgba(122,162,255,.16), transparent 60%),
        radial-gradient(1000px 700px at -10% 110%, rgba(102,223,192,.15), transparent 60%),
        linear-gradient(135deg,var(--bg),var(--bg2));
      min-height:100vh;
    }

    .container{
      max-width:1200px;
      margin:24px auto;
      padding:0 16px 24px;
    }

    .topbar{
      display:flex;
      gap:12px;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .brand{
      display:flex;align-items:center;gap:10px;
      padding:10px 14px;
      border-radius:16px;
      background:var(--glass);
      border:1px solid var(--stroke);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      font-weight:900;
      letter-spacing:.2px;
    }

    .actions{display:flex; gap:8px; flex-wrap:wrap}
    .btn{
      border:0; cursor:pointer;
      border-radius:12px;
      padding:10px 12px;
      color:var(--text);
      background:var(--glass);
      border:1px solid var(--stroke);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      font-weight:700;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
    }

    .card{
      border-radius:20px;
      padding:16px;
      background:var(--glass);
      border:1px solid var(--stroke);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .card::after{
      content:"";
      position:absolute; inset:auto -30% -60% auto;
      width:220px; height:220px; border-radius:50%;
      background: radial-gradient(circle, rgba(255,255,255,.42), transparent 60%);
      pointer-events:none;
    }

    .span-4{grid-column: span 4}
    .span-6{grid-column: span 6}
    .span-12{grid-column: span 12}

    .metric{
      display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
    }

    .title{
      font-size:.95rem; color:var(--muted); font-weight:700;
      display:flex; align-items:center; gap:8px;
    }

    .price{
      font-size:1.8rem; font-weight:900; line-height:1.3;
      margin-top:8px;
      letter-spacing:.2px;
    }

    .unit{font-size:.92rem; color:var(--muted); font-weight:700}
    .meta{
      margin-top:8px; font-size:.82rem; color:var(--muted); line-height:1.9;
    }

    .badge{
      font-size:.75rem;
      padding:5px 9px;
      border-radius:999px;
      font-weight:800;
      background:rgba(16,185,129,.12);
      color:var(--ok);
    }
    .badge.warn{
      background:rgba(245,158,11,.14);
      color:var(--warn);
    }

    .copy-btn{
      margin-top:10px;
      font-size:.78rem;
      padding:7px 10px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      background:#ffffffaa;
      color:#111827;
      font-weight:800;
    }

    .gold{background: linear-gradient(160deg, color-mix(in srgb, var(--c3) 25%, transparent), var(--glass));}
    .silver{background: linear-gradient(160deg, color-mix(in srgb, var(--c1) 22%, transparent), var(--glass));}
    .usd{background: linear-gradient(160deg, color-mix(in srgb, var(--c2) 20%, transparent), var(--glass));}
    .status{background: linear-gradient(160deg, color-mix(in srgb, var(--c4) 20%, transparent), var(--glass));}

    .social{
      margin-top:14px;
      display:flex; justify-content:center; gap:10px;
      padding:12px;
      border-radius:16px;
      background:var(--glass);
      border:1px solid var(--stroke);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }
    .icon{
      width:40px;height:40px;border-radius:12px;
      display:grid;place-items:center;
      background:#ffffffb0;
      border:1px solid #ffffff80;
    }
    [data-theme="deep-dark"] .icon{background:#0f2747;border-color:#1f3b66}
    .icon svg{width:22px;height:22px;fill:currentColor}

    .toast{
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:20px; z-index:99;
      background:#111827; color:#fff;
      border-radius:12px; padding:10px 14px;
      font-size:.86rem; opacity:0; pointer-events:none; transition:.2s;
    }
    .toast.show{opacity:1}

    @media (max-width: 980px){
      .span-4,.span-6{grid-column: span 12}
      .price{font-size:1.55rem}
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">📊 نبض بازار</div>
      <div class="actions">
        <button class="btn" id="themeToggle">🌙 / ☀️ تم</button>
        <button class="btn" id="refreshBtn">🔄 بارگذاری داده</button>
      </div>
    </header>

    <main class="grid">
      <section class="card gold span-4">
        <div class="metric">
          <div>
            <div class="title">🟡 طلای ۱۸ عیار</div>
            <div class="price" id="goldPrice">--</div>
            <div class="unit">ریال / ۱ میلی‌گرم</div>
          </div>
          <span class="badge" id="goldState">...</span>
        </div>
        <div class="meta" id="goldMeta">در حال دریافت...</div>
        <button class="copy-btn" data-copy="gold">📋 کپی قیمت</button>
      </section>

      <section class="card silver span-4">
        <div class="metric">
          <div>
            <div class="title">⚪ نقره ۹۹۹</div>
            <div class="price" id="silverPrice">--</div>
            <div class="unit">ریال / ۱ میلی‌گرم</div>
          </div>
          <span class="badge" id="silverState">...</span>
        </div>
        <div class="meta" id="silverMeta">در حال دریافت...</div>
        <button class="copy-btn" data-copy="silver">📋 کپی قیمت</button>
      </section>

      <section class="card usd span-4">
        <div class="metric">
          <div>
            <div class="title">💵 دلار آزاد</div>
            <div class="price" id="usdPrice">--</div>
            <div class="unit">ریال / ۱ دلار</div>
          </div>
          <span class="badge" id="usdState">...</span>
        </div>
        <div class="meta" id="usdMeta">در حال دریافت...</div>
        <button class="copy-btn" data-copy="usd">📋 کپی قیمت</button>
      </section>

      <section class="card status span-12">
        <div class="title">🧠 وضعیت همگام‌سازی</div>
        <div class="meta" id="syncMeta">در حال آماده‌سازی...</div>
      </section>
    </main>

    <footer class="social" aria-label="social-box">
      <div class="icon" title="Instagram">
        <svg viewBox="0 0 24 24"><path d="M7 2C4.2 2 2 4.2 2 7v10c0 2.8 2.2 5 5 5h10c2.8 0 5-2.2 5-5V7c0-2.8-2.2-5-5-5H7zm11 2a1 1 0 110 2 1 1 0 010-2zM12 7a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6z"/></svg>
      </div>
      <div class="icon" title="Telegram">
        <svg viewBox="0 0 24 24"><path d="M21.9 4.6c.3-1.3-1-2.4-2.2-1.9L3.2 9c-1.4.5-1.3 2.5.1 2.9l3.9 1.1 1.4 4.7c.4 1.3 2 1.7 2.9.8l2.2-2.1 4.3 3.2c1 .8 2.5.2 2.8-1.1l1.1-13.9z"/></svg>
      </div>
      <div class="icon" title="X">
        <svg viewBox="0 0 24 24"><path d="M3 3h4.6l4.1 5.8L16.8 3H21l-7.2 8.1L21.5 21h-4.6l-4.6-6.4L6.6 21H2.5l7.3-8.2L3 3z"/></svg>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast">کپی شد ✅</div>

  <script>
    const DATA_URL = "./data/prices.json";
    const CACHE_KEY = "market_pulse_prices_v2";
    const THEME_KEY = "market_pulse_theme";

    const fmtFa = new Intl.NumberFormat("fa-IR");
    const fmtJalali = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
      dateStyle: "medium",
      timeStyle: "medium",
      timeZone: "Asia/Tehran"
    });

    const $ = (id) => document.getElementById(id);

    function showToast(msg="کپی شد ✅"){
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"), 1400);
    }

    function copyText(text){
      navigator.clipboard.writeText(String(text)).then(
        ()=>showToast("قیمت کپی شد ✨"),
        ()=>showToast("کپی نشد 😅")
      );
    }

    function setTheme(theme){
      if(theme === "deep-dark"){
        document.documentElement.setAttribute("data-theme","deep-dark");
      }else{
        document.documentElement.removeAttribute("data-theme");
      }
      localStorage.setItem(THEME_KEY, theme);
    }

    function loadTheme(){
      const t = localStorage.getItem(THEME_KEY) || "light";
      setTheme(t);
    }

    function isFresh(lastSuccessIso, lastRunIso){
      // اگر last_success با last_run برابر باشد یعنی در همین ران مقدار تازه گرفته شده
      return !!lastSuccessIso && !!lastRunIso && (lastSuccessIso === lastRunIso);
    }

    function isoToJalali(iso){
      if(!iso) return "—";
      const d = new Date(iso);
      if(isNaN(d)) return "—";
      return fmtJalali.format(d);
    }

    function setCard(key, value, lastSuccess, lastRun){
      const priceEl = $(key+"Price");
      const stateEl = $(key+"State");
      const metaEl  = $(key+"Meta");

      const hasValue = value !== null && value !== undefined && value !== "";
      if(!hasValue){
        priceEl.textContent = "--";
        stateEl.textContent = "⚠️ بدون داده";
        stateEl.classList.add("warn");
        metaEl.textContent = "⚠️ قیمتی ثبت نشده است.";
        return;
      }

      priceEl.textContent = fmtFa.format(Number(value));

      const fresh = isFresh(lastSuccess, lastRun);
      if(fresh){
        stateEl.textContent = "✅ تازه";
        stateEl.classList.remove("warn");
        metaEl.textContent = `آخرین موفقیت: ${isoToJalali(lastSuccess)}`;
      }else{
        stateEl.textContent = "🕓 آرشیوی";
        stateEl.classList.add("warn");
        metaEl.textContent = `آخرین قیمت موفق (Fallback): ${isoToJalali(lastSuccess)}`;
      }
    }

    function render(data){
      setCard("gold", data.gold, data.gold_last_success, data.last_run_at);
      setCard("silver", data.silver, data.silver_last_success, data.last_run_at);
      setCard("usd", data.usd, data.usd_last_success, data.last_run_at);

      $("syncMeta").textContent =
        `آخرین اجرای ربات: ${isoToJalali(data.last_run_at)} | منبع: tgju.org | واحد: ریال`;

      // bind copy
      document.querySelectorAll(".copy-btn").forEach(btn=>{
        btn.onclick = () => {
          const key = btn.dataset.copy;
          const val = data[key];
          if(val === null || val === undefined){
            showToast("داده‌ای برای کپی نیست 🙃");
            return;
          }
          copyText(val);
        };
      });
    }

    async function loadData(){
      // اول از cache برای UX سریع
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached){
        try{ render(JSON.parse(cached)); }catch(e){}
      }

      // بعد سعی در دریافت فایل جدید
      try{
        const res = await fetch(DATA_URL + "?t=" + Date.now(), {cache:"no-store"});
        if(!res.ok) throw new Error("HTTP "+res.status);
        const data = await res.json();
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        render(data);
      }catch(err){
        console.warn("fetch failed", err);
        if(!cached){
          $("syncMeta").textContent = "عدم دسترسی به داده و کش خالی است.";
        }else{
          showToast("شبکه ناموفق بود؛ داده کش نمایش داده شد");
        }
      }
    }

    $("themeToggle").addEventListener("click", ()=>{
      const now = localStorage.getItem(THEME_KEY) || "light";
      setTheme(now === "light" ? "deep-dark" : "light");
    });

    $("refreshBtn").addEventListener("click", loadData);

    loadTheme();
    loadData();
  </script>
</body>
</html>
