<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رصد لحظه‌ای قیمت‌ها</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px; text-align: center; }
    .item { margin: 18px 0; padding: 12px; background: #334155; border-radius: 10px; }
    .val { font-size: 20px; font-weight: bold; color: #38bdf8; display: block; margin-top: 5px; }
    .time { font-size: 11px; color: #94a3b8; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📊 نرخ‌های زنده</h2>
    <div class="item">قیمت هر میلی‌گرم طلا: <span id="gold" class="val">در حال بارگذاری...</span></div>
    <div class="item">قیمت هر میلی‌گرم نقره: <span id="silver" class="val">در حال بارگذاری...</span></div>
    <div class="item">نرخ دلار (ریال): <span id="dollar" class="val">در حال بارگذاری...</span></div>
    <div class="time" id="time"></div>
  </div>

  <script>
            async function fetchPrices() {
            try {
                // این بار با پسوند .json صداش می‌زنیم تا پیداش کنه
                const response = await fetch('./data/prices.json?t=' + Date.now()); 
                if (!response.ok) throw new Error("مشکل در دریافت فایل JSON");
                const data = await response.json();

                // حالا اسم کلیدها رو دقیقاً همونطوری که پایتون میسازه گذاشتیم
                document.getElementById('gold-price').innerText = `${data.gold_mg_rial.toLocaleString('fa-IR')} ریال`;
                document.getElementById('silver-price').innerText = `${data.silver_mg_rial.toLocaleString('fa-IR')} ریال`;
                document.getElementById('dollar-price').innerText = `${data.dollar_rial.toLocaleString('fa-IR')} ریال`;
                
                // اگه جایی داری که ساعت رو نشون میده اینم اصلاح کن:
                const timeEl = document.getElementById('last-updated');
                if(timeEl && data.updated_at) timeEl.innerText = `آخرین آپدیت: ${data.updated_at}`;

                // ذخیره در لوکال استوریج برای لود سریع‌تر دفعات بعد
                localStorage.setItem('cachedPrices', JSON.stringify(data));
                
            } catch (error) {
                console.error('خطا در دریافت قیمت‌ها:', error);
                // اگر خطا داد، چک می‌کنیم قبلاً چیزی ذخیره کرده بودیم یا نه
                const cached = localStorage.getItem('cachedPrices');
                if (cached) {
                    const data = JSON.parse(cached);
                    document.getElementById('gold-price').innerText = `${data.gold_mg_rial.toLocaleString('fa-IR')} ریال`;
                    document.getElementById('silver-price').innerText = `${data.silver_mg_rial.toLocaleString('fa-IR')} ریال`;
                    document.getElementById('dollar-price').innerText = `${data.dollar_rial.toLocaleString('fa-IR')} ریال`;
                } else {
                    document.getElementById('gold-price').innerText = "خطا در دریافت اطلاعات";
                    document.getElementById('silver-price').innerText = "خطا در دریافت اطلاعات";
                    document.getElementById('dollar-price').innerText = "خطا در دریافت اطلاعات";
                }
            }
        }

    updateData();
  </script>
</body>
</html>
