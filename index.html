<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نبض بازار | داشبورد حرفه‌ای</title>
    <!-- اضافه کردن کتابخانه برای خروجی گرفتن عکس -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* =========================================================
           بخش اول: متغیرها و تنظیمات پایه (Senior Level CSS)
           ترکیب استایل‌ها: نئومورفیسم 30% + گلس‌مورفیسم 40% + بنتو 30%
           ========================================================= */
        :root {
            /* تم سفید صدفی و پاستلی */
            --bg-color: #e0e5ec;
            --card-bg: rgba(255, 255, 255, 0.4);
            --card-border: rgba(255, 255, 255, 0.6);
            --text-main: #2d3748;
            --text-muted: #718096;
            --neu-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
            --accent-gold: #fbbf24;
            --accent-silver: #94a3b8;
            --accent-dollar: #34d399;
        }

        /* تم Deep Dark (لاکچری بلو) */
        body.dark-mode {
            --bg-color: #0f172a; /* Deep Blue */
            --card-bg: rgba(30, 41, 59, 0.5);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --neu-shadow: 10px 10px 20px rgba(0,0,0,0.5), -10px -10px 20px rgba(30,40,60,0.5);
        }

        @import url('https://v1.fontapi.ir/css/Vazir');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazir', sans-serif;
            transition: background 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* =========================================================
           بخش دوم: ساختار بنتو گرید (Bento Grid)
           ========================================================= */
        .dashboard-wrapper {
            width: 100%;
            max-width: 1000px;
            /* Container اصلی برای خروجی عکس */
            position: relative;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            border-radius: 30px;
        }

        /* =========================================================
           بخش سوم: گلس‌مورفیسم + نئومورفیسم (کارت‌ها)
           ========================================================= */
        .glass-neu-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            padding: 30px;
            box-shadow: var(--neu-shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .glass-neu-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .glass-neu-card:hover::before {
            opacity: 1;
        }

        .card-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
        }

        .price-title {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .price-value {
            font-size: 2.2rem;
            font-weight: bold;
            direction: ltr;
        }

        /* =========================================================
           بخش چهارم: دکمه‌ها و ابزارها
           ========================================================= */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--card-bg);
            backdrop-filter: blur(5px);
            border: 1px solid var(--card-border);
            padding: 15px 30px;
            border-radius: 15px;
            color: var(--text-main);
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--neu-shadow);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn:active {
            box-shadow: inset 5px 5px 10px rgba(0,0,0,0.1), inset -5px -5px 10px rgba(255,255,255,0.2);
        }

        .btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* =========================================================
           بخش پنجم: شبکه‌های اجتماعی
           ========================================================= */
        .social-box {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
        }

        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
        }

        .social-icon {
            width: 30px;
            height: 30px;
            fill: var(--text-main);
        }

        .social-id {
            font-size: 0.8rem;
            display: none; /* در حالت عادی مخفی است */
        }

        /* کلاسی که هنگام خروجی گرفتن به بادی اضافه می‌شود */
        .exporting .social-id {
            display: block; /* فقط در عکس نمایش داده می‌شود */
        }
        .exporting .controls {
            display: none; /* دکمه‌ها در عکس نباشند */
        }

        /* ریسپانسیو اختصاصی */
        @media (max-width: 600px) {
            .price-value { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper" id="capture-area">
        
        <div style="text-align: center; margin-bottom: 20px;">
            <h1 style="font-size: 2rem; margin-bottom: 5px;">نبض بازار</h1>
            <p id="last-update" style="color: var(--text-muted); font-size: 0.9rem;">در حال دریافت اطلاعات...</p>
        </div>

        <div class="bento-grid">
            <!-- کارت طلا -->
            <div class="glass-neu-card">
                <svg class="card-icon" style="fill: var(--accent-gold);" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 7.5l-10-5v10l10 5 10-5v-10l-10 5z"/></svg>
                <div class="price-title">طلای ۱۸ عیار (میلی‌گرم)</div>
                <div class="price-value" id="gold-price">---</div>
            </div>

            <!-- کارت نقره -->
            <div class="glass-neu-card">
                <svg class="card-icon" style="fill: var(--accent-silver);" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                <div class="price-title">نقره ۹۹۹ (میلی‌گرم)</div>
                <div class="price-value" id="silver-price">---</div>
            </div>

            <!-- کارت دلار -->
            <div class="glass-neu-card">
                <svg class="card-icon" style="fill: var(--accent-dollar);" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
                <div class="price-title">دلار (ریال)</div>
                <div class="price-value" id="dollar-price">---</div>
            </div>
        </div>

        <!-- شبکه‌های اجتماعی -->
        <div class="social-box">
            <div class="social-item">
                <svg class="social-icon" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                <span class="social-id">@mm.keshavarzz</span>
            </div>
            <div class="social-item">
                <svg class="social-icon" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.888-.666 3.473-1.512 5.79-2.509 6.951-2.991 3.308-1.371 3.995-1.61 4.436-1.617z"/></svg>
                <span class="social-id">@ke_mim_mim</span>
            </div>
            <div class="social-item">
                <svg class="social-icon" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
                <span class="social-id">@s_keshavarz</span>
            </div>
        </div>

        <!-- ابزارها و دکمه‌ها -->
        <div class="controls">
            <button class="btn" onclick="toggleTheme()">
                <svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18zm0-2a7 7 0 1 0 0-14 7 7 0 0 0 0 14zm0-2.5A4.5 4.5 0 1 1 12 7.5v9z"/></svg>
            </button>
            <button class="btn" onclick="exportToPNG()">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>
            <button class="btn" onclick="fetchData()">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>

    </div>

    <!-- =========================================================
         بخش ششم: منطق جاوااسکریپت (Senior JS Level)
         استفاده از localStorage، آپدیت زنده، خروجی عکس
         ========================================================= -->
    <script>
        const formatNumber = (num) => {
            if (!num) return "نامشخص";
            return new Intl.NumberFormat('fa-IR').format(num);
        };

        const updateUI = (data) => {
            document.getElementById('gold-price').innerText = formatNumber(data.gold_mg_rial);
            document.getElementById('silver-price').innerText = formatNumber(data.silver_mg_rial);
            document.getElementById('dollar-price').innerText = formatNumber(data.dollar_rial);
            
            if(data.updated_at) {
                const date = new Date(data.updated_at);
                const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                document.getElementById('last-update').innerText = "آخرین به‌روزرسانی: " + new Intl.DateTimeFormat('fa-IR', options).format(date);
            }
        };

        const fetchData = async () => {
            try {
                // اضافه کردن timestamp برای جلوگیری از کش شدن در مرورگر
                const response = await fetch(`./data/prices.json?t=${new Date().getTime()}`);
                const data = await response.json();
                
                // ذخیره در لوکال استوریج تا با رفرش صفحه از بین نرود
                localStorage.setItem('market_pulse_data', JSON.stringify(data));
                updateUI(data);
            } catch (error) {
                console.error("خطا در دریافت اطلاعات", error);
                document.getElementById('last-update').innerText = "خطا در دریافت اطلاعات جدید. در حال نمایش آخرین دیتای ذخیره شده.";
                // اگر آپدیت فیلد شد، دیتای ذخیره شده رو بخون
                const cachedData = localStorage.getItem('market_pulse_data');
                if (cachedData) updateUI(JSON.parse(cachedData));
            }
        };

        const toggleTheme = () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('market_pulse_theme', isDark ? 'dark' : 'light');
        };

        // لود کردن تم و داده‌ها هنگام باز شدن صفحه
        window.onload = () => {
            const savedTheme = localStorage.getItem('market_pulse_theme');
            if (savedTheme === 'dark') document.body.classList.add('dark-mode');
            
            const cachedData = localStorage.getItem('market_pulse_data');
            if (cachedData) updateUI(JSON.parse(cachedData));
            
            fetchData();
        };

        // قابلیت خفن خروجی PNG
        const exportToPNG = () => {
            const wrap = document.getElementById('capture-area');
            
            // اضافه کردن کلاس برای نمایش آیدی‌ها و مخفی کردن دکمه‌ها
            document.body.classList.add('exporting');

            // استفاده از html2canvas
            html2canvas(wrap, {
                backgroundColor: document.body.classList.contains('dark-mode') ? '#0f172a' : '#e0e5ec',
                scale: 2 // کیفیت بالا
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Nabz_Bazaar.png'; // اسم مرتبط با برنامه
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // حذف کلاس پس از گرفتن عکس
                document.body.classList.remove('exporting');
            });
        };
    </script>
</body>
</html>
