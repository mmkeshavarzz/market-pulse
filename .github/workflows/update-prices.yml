name: Update Prices

on:
  schedule:
    - cron: '*/5 * * * *'  # اجرا هر ۵ دقیقه
  workflow_dispatch:        # قابلیت اجرای دستی

permissions:
  contents: write           # اجازه پوش کردن تغییرات

concurrency:
  group: "price-update"
  cancel-in-progress: true  # جلوگیری از تداخل اجراها

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: pip install requests beautifulsoup4

      - name: 🚀 Run Scraper
        # سوئیچ -u باعث می‌شود لاگ‌ها در لحظه چاپ شوند تا دیباگ راحت‌تر شود
        run: python -u scraper.py

      - name: 💾 Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Auto-update prices: $(date)" || echo "No changes to commit"
          git push
